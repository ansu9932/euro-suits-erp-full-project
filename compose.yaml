name: euro-suits-erp
services:
  postgres:
    networks: [data]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: euroerp
      POSTGRES_USER: euroerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the setup script first}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U euroerp -d euroerp']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    networks: [data]
    image: redis:8-alpine
    command: [/bin/sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run setup-local.py or scripts/provision_database.py}
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    networks: [data]
    build: ./backend
    command: [migrate]
    environment:
      DATABASE_URL: postgres://euroerp:${POSTGRES_PASSWORD}@postgres:5432/euroerp?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      APP_ENV: ${APP_ENV:-local}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_USERNAME: ${OWNER_USERNAME:-}
      OWNER_NAME: ${OWNER_NAME:-}
      DEVELOPER_EMAIL: ${DEVELOPER_EMAIL:-}
      DEVELOPER_PASSWORD: ${DEVELOPER_PASSWORD:-}
      FILE_ROOT: /tmp/files
      KYC_ENCRYPTION_KEY: ${KYC_ENCRYPTION_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: 'no'
  api:
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
    networks: [default, data]
    build: ./backend
    environment:
      DATABASE_URL: postgres://euroerp_app:${APP_DB_PASSWORD:?Run scripts/provision_database.py}@postgres:5432/euroerp?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      APP_ENV: ${APP_ENV:-local}
      TRUST_PROXY: 'true'
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-24}
      LOGIN_CONCURRENCY: ${LOGIN_CONCURRENCY:-4}
      LOGIN_PEER_LIMIT: ${LOGIN_PEER_LIMIT:-2000}
      OTP_PEER_LIMIT: ${OTP_PEER_LIMIT:-3000}
      USER_REQUESTS_PER_MINUTE: ${USER_REQUESTS_PER_MINUTE:-300}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      HTTP_ADDR: :8081
      FILE_ROOT: /data/files
      DEMO_SEED: ${DEMO_SEED:-false}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      KYC_ENCRYPTION_KEY: ${KYC_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH_MODE: ${SMTP_AUTH_MODE:-}
      SMTP_TENANT_ID: ${SMTP_TENANT_ID:-}
      SMTP_CLIENT_ID: ${SMTP_CLIENT_ID:-}
      SMTP_CLIENT_SECRET: ${SMTP_CLIENT_SECRET:-}
    volumes: [documents:/data/files]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  web:
    build: ./frontend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  nginx:
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
    image: nginx:stable-alpine
    ports: ['127.0.0.1:8080:80']
    volumes: ['./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [api,web]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  documents:

networks:
  data:
    internal: true
