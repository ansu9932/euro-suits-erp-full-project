limit_req_zone $binary_remote_addr zone=login:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=api_requests:10m rate=300r/s;
server {
    listen 80;
    server_name ${PUBLIC_HOST};
    if ($host != "${PUBLIC_HOST}") { return 444; }
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name ${PUBLIC_HOST};
    if ($host != "${PUBLIC_HOST}") { return 444; }
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    server_tokens off;
    client_max_body_size 21m;
    client_body_timeout 15s;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /api/login {
        limit_req zone=login burst=100 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        limit_req zone=api_requests burst=500 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
    }
    location ~ /\. { return 404; }
    location @login_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"Too many sign-in attempts. Please wait a minute."}';
    }
    location = /metrics { return 404; }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
