name: euro-suits-uat
x-api: &api
  image: euro-suits-uat-api:latest
  build: ../backend
  environment: &env
    DATABASE_URL: postgres://uat_app:${APP_DB_PASSWORD}@postgres:5432/euroerp_uat?sslmode=disable
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    APP_ENV: local
    APP_ORIGIN: http://localhost:8082
    TRUST_PROXY: 'true'
    HTTP_ADDR: :8081
    KYC_ENCRYPTION_KEY: ${KYC_ENCRYPTION_KEY}
    FILE_ROOT: /data/files
    DEMO_SEED: 'false'
    SMTP_HOST: ''
  volumes: [documents:/data/files]
  networks: [data, front]
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: euroerp_uat
      POSTGRES_USER: euroerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U euroerp -d euroerp_uat']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [/bin/sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redisdata:/data]
    networks: [data]
    restart: unless-stopped
  initialize:
    <<: *api
    profiles: [bootstrap]
    environment:
      <<: *env
      DATABASE_URL: postgres://euroerp:${POSTGRES_PASSWORD}@postgres:5432/euroerp_uat?sslmode=disable
      OWNER_PASSWORD: ${BOOTSTRAP_PASSWORD}
    command: [initialize-company-workspace]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    restart: 'no'
  api-local:
    <<: *api
  api-online:
    <<: *api
    environment:
      <<: *env
      APP_ORIGIN: ${PUBLIC_ORIGIN:-https://pending.invalid}
  web:
    image: euro-suits-uat-web:latest
    build: ../frontend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: http://localhost:8082
    networks: [front]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  gateway-local:
    image: nginx:stable-alpine
    ports: ['127.0.0.1:8082:80']
    volumes: ['./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [front]
    depends_on: [api-local,web]
    restart: unless-stopped
  gateway-online:
    image: nginx:stable-alpine
    ports: ['127.0.0.1:8083:80']
    volumes: ['./nginx.online.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [front]
    depends_on: [api-online,web]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  documents:
networks:
  data: {internal: true}
  front: {}
